<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Pokémon TCG Collection</title>
  <link rel="stylesheet" href="wtc-perspective-card.css">
  <link rel="stylesheet" href="styles.css">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
</head>
<body>
  <div class="app-container">
    <!-- ===== HEADER ===== -->
    <header class="header">
      <div class="header-top">
        <div class="header-logo">
          <i class="fas fa-bolt logo-icon"></i>
          <h1 class="logo-text">Pokémon TCG</h1>
          <p class="logo-subtitle">Gotta Collect 'Em All!</p>
        </div>
        <div class="header-auth" id="header-auth">
          <!-- Logged out -->
          <div id="auth-logged-out" class="auth-buttons">
            <button class="btn-primary btn-sm" id="btn-show-signup">Sign Up</button>
            <button class="btn-secondary btn-sm" id="btn-show-login">Login</button>
          </div>
          <!-- Logged in (hidden by default) -->
          <div id="auth-logged-in" class="auth-logged-in" style="display:none;">
            <div class="user-dropdown">
              <button class="btn-secondary btn-sm user-dropdown-btn" id="user-menu-btn">
                <i class="fas fa-user"></i> <span id="username-display"></span> <i class="fas fa-chevron-down"></i>
              </button>
              <div class="user-dropdown-menu" id="user-dropdown-menu">
                <button data-nav="collection"><i class="fas fa-heart"></i> My Collection</button>
                <button id="btn-show-friends"><i class="fas fa-users"></i> Friends</button>
                <button id="btn-logout"><i class="fas fa-sign-out-alt"></i> Logout</button>
              </div>
            </div>
          </div>
        </div>
      </div>
      <nav class="main-nav">
        <button class="nav-btn active" data-page="browse"><i class="fas fa-th"></i> Browse</button>
        <button class="nav-btn" data-page="collection"><i class="fas fa-heart"></i> My Collection (<span id="collection-count">0</span>)</button>
        <span id="collection-value" class="header-value">Value: <span class="value">$0.00</span></span>
      </nav>
    </header>

    <!-- ===== AUTH MODAL ===== -->
    <div class="modal-overlay" id="auth-modal-overlay" style="display:none;">
      <div class="modal auth-modal" id="auth-modal">
        <button class="modal-close" id="auth-modal-close">&times;</button>
        <div class="auth-tabs" id="auth-tabs">
          <button class="auth-tab active" data-tab="login">Login</button>
          <button class="auth-tab" data-tab="signup">Sign Up</button>
        </div>
        <div class="auth-error" id="auth-error" style="display:none;"></div>
        <form id="login-form" class="auth-form">
          <div class="form-group">
            <label><i class="fas fa-user"></i> Username</label>
            <input type="text" id="login-username" placeholder="Enter username" autocomplete="username">
          </div>
          <div class="form-group">
            <label><i class="fas fa-lock"></i> Password</label>
            <input type="password" id="login-password" placeholder="Enter password" autocomplete="current-password">
          </div>
          <button type="submit" class="btn-primary btn-full"><i class="fas fa-sign-in-alt"></i> Login</button>
        </form>
        <form id="signup-form" class="auth-form" style="display:none;">
          <div class="form-group">
            <label><i class="fas fa-user"></i> Username</label>
            <input type="text" id="signup-username" placeholder="Choose a username" autocomplete="username">
          </div>
          <div class="form-group">
            <label><i class="fas fa-lock"></i> Password</label>
            <input type="password" id="signup-password" placeholder="Min 4 characters" autocomplete="new-password">
          </div>
          <button type="submit" class="btn-primary btn-full"><i class="fas fa-user-plus"></i> Sign Up</button>
        </form>
      </div>
    </div>

    <!-- ===== FRIENDS SIDEBAR ===== -->
    <div class="friends-sidebar-overlay" id="friends-sidebar-overlay" style="display:none;"></div>
    <div class="friends-sidebar" id="friends-sidebar">
      <div class="friends-sidebar-header">
        <h3><i class="fas fa-users"></i> Friends</h3>
        <button class="friends-close" id="friends-close">&times;</button>
      </div>
      <div class="friends-add">
        <input type="text" id="add-friend-input" placeholder="Add friend by username...">
        <button class="btn-primary btn-sm" id="add-friend-btn"><i class="fas fa-plus"></i></button>
      </div>
      <div class="friends-error" id="friends-error" style="display:none;"></div>
      <div class="friends-list" id="friends-list">
        <div class="loading">Loading friends...</div>
      </div>
    </div>

    <!-- ===== BROWSE PAGE ===== -->
    <div class="page active" id="page-browse">
      <section class="filters">
        <div class="filter-row">
          <div class="filter-group">
            <label><i class="fas fa-search"></i> Search</label>
            <input type="text" id="search-input" placeholder="Search cards...">
          </div>
          <div class="filter-group">
            <label><i class="fas fa-layer-group"></i> Set</label>
            <select id="set-filter"><option value="">All Sets</option></select>
          </div>
          <div class="filter-group">
            <label><i class="fas fa-dragon"></i> Supertype</label>
            <select id="type-filter"><option value="">All</option></select>
          </div>
          <div class="filter-group">
            <label><i class="fas fa-star"></i> Rarity</label>
            <select id="rarity-filter"><option value="">All</option></select>
          </div>
          <div class="filter-group">
            <label><i class="fas fa-palette"></i> Energy Type</label>
            <select id="pokemon-type-filter"><option value="">All</option></select>
          </div>
        </div>
        <div class="filter-row filter-row-sort">
          <div class="sort-controls">
            <span class="sort-label">Sort by:</span>
            <select id="sort-select" class="sort-select">
              <option value="name">Name</option>
              <option value="number">Number</option>
              <option value="hp">HP</option>
              <option value="supertype">Supertype</option>
              <option value="rarity">Rarity</option>
              <option value="dateReleased">Date Released</option>
              <option value="random">Random</option>
            </select>
            <button class="sort-direction-btn" id="sort-direction-btn" title="Toggle ASC/DESC">
              <i class="fas fa-arrow-up" id="sort-direction-icon"></i>
            </button>
          </div>
        </div>
      </section>

      <div id="cards-container" class="cards-grid"></div>

      <div class="pagination">
        <button id="prev-page" class="btn-secondary"><i class="fas fa-chevron-left"></i> Prev</button>
        <span id="page-info">Page 1</span>
        <button id="next-page" class="btn-secondary">Next <i class="fas fa-chevron-right"></i></button>
      </div>
    </div>

    <!-- ===== CARD DETAIL PAGE ===== -->
    <div class="page" id="page-card">
      <div class="card-page-header">
        <button class="back-btn" id="card-back-btn">
          <i class="fas fa-arrow-left"></i> Back
        </button>
        <button class="btn-primary" id="card-collection-nav-btn">
          <i class="fas fa-heart"></i> My Collection
        </button>
      </div>
      <div class="card-page-content" id="card-page-content"></div>
    </div>

    <!-- ===== COLLECTION PAGE ===== -->
    <div class="page" id="page-collection">
      <div id="collection-content"></div>
    </div>

    <!-- ===== FRIEND COLLECTION PAGE ===== -->
    <div class="page" id="page-friend">
      <div id="friend-collection-content"></div>
    </div>
  </div>

  <!-- ===== SCRIPTS ===== -->
  <script src="wtc-perspective-card.js"></script>
  <script src="app.js"></script>
</body>
</html>
