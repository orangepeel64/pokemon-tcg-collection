services:
  - type: web
    name: pokemon-tcg-collection
    env: node
    plan: free
    buildCommand: npm install
    startCommand: npm start
    disk:
      name: pokemon-data
      mountPath: /data
      sizeGB: 1
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: "10000"
